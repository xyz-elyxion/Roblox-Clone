<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="chat-body">
    <a class="skip-link" href="#chat-log">Skip to messages</a>

    <div class="chat-shell" data-chat-shell>
        <nav class="chat-guilds" aria-label="Servers">
            <a class="chat-guild chat-guild-home" href="/" aria-label="RBLX Clone home">R</a>
            <span class="chat-guild-sep" aria-hidden="true"></span>
            <div class="chat-guilds-games" data-guilds></div>
            <a class="chat-guild chat-guild-add" href="/create" title="Create a game"
               aria-label="Create a game">+</a>
        </nav>

        <aside class="chat-channels" id="chat-channel-panel" data-channel-panel aria-label="Channels">
            <header class="chat-server">
                <div>
                    <h2 data-server-title>Chat</h2>
                    <p class="chat-server-meta" data-server-meta>connecting</p>
                </div>
            </header>

            <div class="chat-groups">
                <section class="chat-group" aria-labelledby="chat-group-text">
                    <h3 class="chat-group-title" id="chat-group-text">Text channels</h3>
                    <div data-channel-list></div>
                </section>
            </div>

            <div class="chat-userbar">
                <span class="chat-avatar" data-user-initials aria-hidden="true">G</span>
                <div class="chat-userbar-text">
                    <span class="chat-userbar-name" data-user-name>Guest</span>
                    <span class="chat-userbar-tag" data-user-status>not signed in</span>
                </div>
                <a class="chat-icon-button" href="/settings" aria-label="Settings">&#9881;</a>
                <a class="chat-icon-button" href="/login?next=%2Fchat" data-nav-guest aria-label="Sign in">&#8594;</a>
                <button class="chat-icon-button" type="button" data-logout data-nav-user hidden aria-label="Log out">
                    &times;
                </button>
            </div>
        </aside>

        <main class="chat-main" id="main" tabindex="-1">
            <header class="chat-head">
                <button class="chat-icon-button chat-channels-toggle" type="button" data-toggle-channels
                        aria-expanded="false" aria-controls="chat-channel-panel" aria-label="Show channels">
                    &#9776;
                </button>
                <span class="chat-hash" aria-hidden="true">#</span>
                <h1 data-channel-title>general</h1>
                <p class="chat-topic" data-channel-topic></p>
                <button class="chat-text-button chat-members-toggle" type="button" data-toggle-members
                        aria-pressed="false">
                    Members
                </button>
            </header>

            <div class="chat-log" id="chat-log" data-chat-log role="log" aria-live="polite"
                 aria-relevant="additions" aria-label="Messages" tabindex="-1"></div>

            <form class="chat-composer" data-composer>
                <div class="chat-composer-field">
                    <textarea rows="1" maxlength="500" data-message-input aria-label="Message"
                              aria-describedby="chat-hint" placeholder="Message #general"></textarea>
                    <button class="button small chat-send" type="submit">Send</button>
                </div>
                <p class="chat-hint" id="chat-hint" data-chat-hint aria-live="polite">Enter sends, Shift+Enter starts a new line.</p>
            </form>
        </main>

        <aside class="chat-members" data-member-panel aria-label="Members">
            <div class="chat-member-groups" data-member-groups></div>
        </aside>

        <div class="chat-backdrop" data-chat-backdrop hidden></div>
    </div>

    <noscript>
        <p class="chat-noscript">Chat needs JavaScript: the page reads the room it is showing.</p>
    </noscript>

    <script src="/app.js?v=roles-1" defer></script>
    <script src="/chat.js?v=chat-3" defer></script>
</body>
</html>
