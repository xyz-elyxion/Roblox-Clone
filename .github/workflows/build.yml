name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Release (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      # GLFW 3.3.8 and a few other FetchContent dependencies declare
      # cmake_minimum_required() below 3.5, which CMake 4 refuses outright.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          cmake --version
          git --version

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release --output-on-failure

      - name: Package runnable folder
        # Runs even if the tests fail, so a red run still hands back whatever
        # targets linked.
        if: always()
        shell: pwsh
        run: >
          ./scripts/package-build.ps1
          -Configuration Release
          -BuildDir build/windows-release
          -Output dist/rblx-windows-release

      - name: Upload runnable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-windows-release
          path: dist/rblx-windows-release
          if-no-files-found: warn

  linux:
    name: Linux Release (GCC)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build/linux-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRBLX_BUILD_ANTICHEAT=OFF

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Test
        run: ctest --test-dir build/linux-release --output-on-failure

  macos:
    name: macOS Release (Clang)
    runs-on: macos-14
    timeout-minutes: 60

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          cmake --version
          clang++ --version

      - name: Install build dependencies
        # GLFW, GLM, ImGui, ImGuizmo, rp3d and stb all come from FetchContent;
        # Ninja is the only tool the image does not always provide.
        run: |
          command -v ninja || brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build/macos-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRBLX_BUILD_ANTICHEAT=OFF

      - name: Build
        run: cmake --build build/macos-release --parallel

      - name: Test
        run: ctest --test-dir build/macos-release --output-on-failure

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-macos-release
          path: |
            build/macos-release/Studio
            build/macos-release/Server
            build/macos-release/Client
            build/macos-release/WebApp
          if-no-files-found: warn
