<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page" data-search-page>
        <header class="topbar">
            <a class="brand" href="/" aria-label="RBLX Clone home">
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/dashboard" data-nav-user hidden>Home</a>
                <a href="/games">Games</a>
                <a href="/chat" data-nav-user hidden>Chat</a>
                <a href="/welcome">Tour</a>
                <a href="/create" data-nav-user hidden>Create</a>
                <a href="/dashboard#search" data-nav-user hidden>Search</a>
                <a href="/avatar" data-nav-user hidden>Avatar</a>
                <a href="/profile" data-nav-user hidden>Profile</a>
                <a href="/settings" data-nav-user hidden>Settings</a>
                <a href="/developers" data-nav-user hidden>Developers</a>
                <a href="/admin" data-admin-only data-nav-user hidden>Admin</a>
                <a href="/login" data-nav-guest>Login</a>
                <a href="/signup" data-nav-guest>Sign up</a>
                <button class="button danger" type="button" data-logout data-nav-user hidden>Logout</button>
            </nav>
        </header>

        <main id="main">
            <div class="dashboard-head">
                <div>
                    <p class="label">People</p>
                    <h1 class="page-title">Search</h1>
                </div>
            </div>

            <section class="search-layout">
                <form class="panel search-panel" data-search-form>
                    <label class="field" for="people-search">
                        <span>Username or user ID</span>
                        <input class="input" id="people-search" name="q" type="search" autocomplete="off" data-search-input>
                    </label>
                    <button class="button" type="submit">Search people</button>
                    <div class="status" data-search-status aria-live="polite"></div>
                </form>

                <section class="panel">
                    <div class="panel-heading">
                        <div>
                            <p class="label">Results</p>
                            <h2>Players</h2>
                        </div>
                    </div>
                    <div class="user-grid" data-search-results></div>
                </section>
            </section>
        </main>
        <footer class="legal-footer">
            <span>RBLX Clone · local prototype</span>
            <nav aria-label="Legal">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </nav>
        </footer>
    </div>
    <script src="/app.js?v=standing-2" defer></script>
</body>
</html>
