name: Build

# One workflow, two stages: build the vendored build tool out of rblxbuild/, then
# use that tool - not an installed CMake on the runner - to configure, build, test and
# package the game. If the tool cannot build the project, that is the failure this
# workflow exists to report.
#
# The tool bootstrap only ever runs on a POSIX shell with a compiler: on Windows
# that means MSYS2/MinGW, because bootstrap rejects every generator except
# "MSYS Makefiles", "Unix Makefiles" and "Ninja". Once built, the tool itself can
# drive MSVC through the Visual Studio generator, so the game still ships a
# normal MSVC build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The group serialises this branch's builds, which is what cancel-in-progress
# needs. A run GitHub leaves queued after a service incident is never cancelled,
# though: it holds the group and every later push waits behind it. The suffix
# below gives new runs a group of their own while such a record exists; drop it
# once the stuck run is gone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v2
  cancel-in-progress: true

env:
  # The tree does not vendor OpenSSL (no TLS needed to build the tool) and its
  # Tests/ directory was pruned, so neither belongs in a bootstrap.
  RBLXBUILD_TOOL_FLAGS: -DRBLXBUILD_USE_OPENSSL=OFF -DBUILD_TESTING=OFF
  # GLFW and the other fetched dependencies declare minimum versions below 3.5,
  # which RBLXBuild - like the tool it was forked from - refuses outright.
  RBLXBUILD_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  windows:
    name: Windows Release (MSVC, tool built with MinGW)
    runs-on: windows-2022
    timeout-minutes: 90

    # The bootstrap stage is a POSIX shell script, so it runs in MSYS2. The game
    # itself is configured and built by the tool it produces, with the Visual
    # Studio generator, so the shipped binaries are MSVC like before.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            make
            mingw-w64-x86_64-gcc

      # The tool is vendored and changes rarely, so it is kept between runs: the
      # key is the contents of rblxbuild/ itself, which is what "the compiler code
      # has not changed" means, plus a token bumped by hand when the flags below
      # change. Hashing this workflow file instead would mean every edit here - a
      # comment, a concurrency group - threw the tool away. Only an exact key
      # hits: a near match would hand back a tool built from different sources,
      # which is worse than rebuilding.
      #
      # bin alone is not a working tool: rblxbuild reads its Modules tree from
      # share/<name>-<version>/ next to the executable. Caching only bin produced a
      # restored tool that failed with "Could not find RBLXBUILD_ROOT" before it
      # could configure anything, so both are kept.
      #
      # Restore and save are separate actions on purpose. actions/cache saves in a
      # post step that only runs when the job succeeds, so a run that failed later
      # - a compile error, a red test - threw the bootstrap away and the next run
      # paid for it again. Saving immediately after the bootstrap keeps it.
      - name: Restore the build tool
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rblxbuild-tool/bin
            build/rblxbuild-tool/share
          key: rblxbuild-tool-${{ runner.os }}-flags1-${{ hashFiles('rblxbuild/**') }}

      - name: Look for a build tool
        id: tool
        run: |
          # The Modules tree is what the executable reads at startup, so a
          # restored bin without it is not usable and must not skip the bootstrap.
          if [ -x build/rblxbuild-tool/bin/rblxbuild.exe ] &&
             ls build/rblxbuild-tool/share/*/Modules > /dev/null 2>&1; then
            echo "reusing the build tool from the cache"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "no usable build tool cached; bootstrapping one"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build RBLXBuild
        if: steps.tool.outputs.reused != 'true'
        # No --generator: bootstrap's MinGW default is "MSYS Makefiles", the
        # configuration whose POSIX paths MSYS make translates for native g++.
        run: |
          mkdir -p build/rblxbuild-tool
          cd build/rblxbuild-tool
          ../../rblxbuild/bootstrap \
            --parallel=$(nproc) \
            -- $RBLXBUILD_TOOL_FLAGS
          make -j$(nproc)

      # Saved here rather than by a post step, so a build that fails later still
      # leaves the tool behind for the next run. A cache hit is already stored.
      - name: Save the build tool
        if: steps.tool.outputs.reused != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/rblxbuild-tool/bin
            build/rblxbuild-tool/share
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

      # Printed either way, so the log says which tool configured the build.
      - name: Report the build tool
        run: ./build/rblxbuild-tool/bin/rblxbuild --version

      - name: Configure the game with RBLXBuild
        run: >-
          ./build/rblxbuild-tool/bin/rblxbuild -S . -B build/windows-release
          -G "Visual Studio 17 2022" -A x64
          -DRBLXBUILD_BUILD_TYPE=Release

      - name: Build the game with RBLXBuild
        run: >-
          ./build/rblxbuild-tool/bin/rblxbuild --build build/windows-release
          --config Release --parallel $(nproc)

      - name: Test
        # There is no rblxtest binary to run here. The Visual Studio generator
        # drops the executables in Release\, and the working directory stays the
        # build directory ctest used.
        run: |
          cd build/windows-release
          failed=0
          for t in Release/*Tests.exe; do
            echo "=== $t"
            "./$t" || failed=1
          done
          exit $failed

      - name: Package runnable folder
        # Runs even if the tests fail, so a red run still hands back whatever
        # targets linked.
        if: always()
        shell: pwsh
        run: >
          ./scripts/package-build.ps1
          -Configuration Release
          -BuildDir build/windows-release
          -Output dist/rblx-windows-release

      - name: Upload runnable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-windows-release
          path: dist/rblx-windows-release
          if-no-files-found: warn
