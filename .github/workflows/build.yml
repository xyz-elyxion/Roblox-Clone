name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug:
    name: Windows Debug (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      # GLFW 3.3.8 and a few other FetchContent dependencies declare
      # cmake_minimum_required() below 3.5, which CMake 4 refuses outright.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          cmake --version
          git --version

      - name: Configure
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug --parallel

      - name: Test
        run: ctest --preset windows-debug --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rblx-windows-debug
          path: |
            build/windows-debug/Debug/Studio.exe
            build/windows-debug/Debug/Client.exe
            build/windows-debug/Debug/Server.exe
            build/windows-debug/Debug/NetworkProtocolTests.exe
          if-no-files-found: error
