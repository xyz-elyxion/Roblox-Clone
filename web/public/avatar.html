<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page" data-avatar>
        <header class="topbar">
            <a class="brand" href="/" aria-label="RBLX Clone home">
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/dashboard" data-nav-user hidden>Home</a>
                <a href="/games">Games</a>
                <a href="/welcome">Tour</a>
                <a href="/create" data-nav-user hidden>Create</a>
                <a href="/dashboard#search" data-nav-user hidden>Search</a>
                <a href="/avatar" data-nav-user hidden>Avatar</a>
                <a href="/profile" data-nav-user hidden>Profile</a>
                <a href="/settings" data-nav-user hidden>Settings</a>
                <a href="/admin" data-admin-only data-nav-user hidden>Admin</a>
                <a href="/login" data-nav-guest>Login</a>
                <a href="/signup" data-nav-guest>Sign up</a>
                <button class="button danger" type="button" data-logout data-nav-user hidden>Logout</button>
            </nav>
        </header>

        <main id="main">
            <div class="dashboard-head">
                <div>
                    <p class="label">Avatar</p>
                    <h1 class="page-title">Colors</h1>
                </div>
                <button class="button" type="button" data-save-avatar>Save avatar</button>
            </div>

            <section class="avatar-layout">
                <div class="panel avatar-preview-panel">
                    <h2>Preview</h2>
                    <div class="avatar-stage">
                        <div class="avatar-figure" data-avatar-figure aria-label="Avatar preview"></div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Body part</h2>
                    <div class="part-tabs" data-part-tabs></div>

                    <div class="color-picker-panel">
                        <label class="color-picker-field">
                            <span>Color</span>
                            <input type="color" value="#cc9966" data-color-picker aria-label="Selected body part color">
                        </label>
                        <output class="color-code" data-color-code>#CC9966</output>
                    </div>

                    <div class="face-picker-panel">
                        <h3>Face</h3>
                        <div class="face-options" data-face-options></div>
                    </div>

                    <div class="face-picker-panel">
                        <div class="panel-heading">
                            <h3>Hats</h3>
                            <output class="color-code" data-coins>0 coins</output>
                        </div>
                        <p class="lede">Coins come from playtime: a minute in a game earns one.</p>
                        <div class="face-options hat-options" data-hat-options></div>
                    </div>

                    <div class="status" data-status aria-live="polite"></div>
                </div>
            </section>
        </main>
        <footer class="legal-footer">
            <span>RBLX Clone · local prototype</span>
            <nav aria-label="Legal">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </nav>
        </footer>
    </div>
    <script src="/app.js?v=standing-2" defer></script>
</body>
</html>
