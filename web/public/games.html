<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page" data-games-page>
        <header class="topbar">
            <a class="brand" href="/" aria-label="RBLX Clone home">
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/dashboard" data-nav-user hidden>Home</a>
                <a href="/games">Games</a>
                <a href="/chat" data-nav-user hidden>Chat</a>
                <a href="/friends" data-nav-user hidden>Friends</a>
                <a href="/welcome">Tour</a>
                <a href="/support">Support</a>
                <a href="/create" data-nav-user hidden>Create</a>
                <a href="/dashboard#search" data-nav-user hidden>Search</a>
                <a href="/avatar" data-nav-user hidden>Avatar</a>
                <a href="/profile" data-nav-user hidden>Profile</a>
                <a href="/settings" data-nav-user hidden>Settings</a>
                <a href="/developers" data-nav-user hidden>Developers</a>
                <a href="/admin" data-admin-only data-nav-user hidden>Admin</a>
                <a href="/login" data-nav-guest>Login</a>
                <a href="/signup" data-nav-guest>Sign up</a>
                <button class="button danger" type="button" data-logout data-nav-user hidden>Logout</button>
            </nav>
        </header>

        <main id="main" tabindex="-1">
            <div class="dashboard-head">
                <div>
                    <p class="label">Discover</p>
                    <h1 class="page-title">Games</h1>
                </div>
                <a class="button" href="/create">Publish</a>
            </div>

            <div class="status" data-games-status aria-live="polite"></div>
            <div class="games-toolbar">
                <label class="games-sort">
                    <span class="label">Sort</span>
                    <select data-games-sort>
                        <option value="likes">Most liked</option>
                        <option value="newest">Newest</option>
                        <option value="title">A to Z</option>
                    </select>
                </label>
            </div>
            <section class="game-grid" data-games-list aria-label="Public games"></section>
        </main>
        <footer class="legal-footer">
            <span>RBLX Clone · local prototype</span>
            <nav aria-label="Legal">
                <a href="/support">Support</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </nav>
        </footer>
    </div>
    <script src="/app.js?v=likes-1" defer></script>
</body>
</html>
