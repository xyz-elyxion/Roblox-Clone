<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="/" aria-label="RBLX Clone home">
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/dashboard" data-nav-user hidden>Home</a>
                <a href="/games">Games</a>
                <a href="/create" data-nav-user hidden>Create</a>
                <a href="/dashboard#search" data-nav-user hidden>Search</a>
                <a href="/avatar" data-nav-user hidden>Avatar</a>
                <a href="/profile" data-nav-user hidden>Profile</a>
                <a href="/settings" data-nav-user hidden>Settings</a>
                <a href="/admin" data-admin-only data-nav-user hidden>Admin</a>
                <a href="/login" data-nav-guest>Login</a>
                <a href="/signup" data-nav-guest>Sign up</a>
                <button class="button danger" type="button" data-logout data-nav-user hidden>Logout</button>
            </nav>
        </header>

        <main id="main" class="auth-layout">
            <section class="panel auth-panel" aria-labelledby="login-title">
                <p class="label">Account</p>
                <h1 id="login-title" class="page-title">Login</h1>
                <p class="lede" data-login-lede>Use the same account in the web dashboard and the player client.</p>

                <form class="form" data-login-form>
                    <div class="field">
                        <label for="username">Username</label>
                        <input class="input" id="username" name="username" type="text" autocomplete="username" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <div class="status" data-status aria-live="polite"></div>
                    <button class="button full" type="submit">Sign in</button>
                </form>
            </section>
        </main>
    </div>
    <script src="/app.js?v=games-1" defer></script>
</body>
</html>
