name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.configuration }} (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60

    strategy:
      # A broken Release build must not hide the Debug result.
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: windows-debug
          - configuration: Release
            preset: windows-release

    env:
      # GLFW 3.3.8 and a few other FetchContent dependencies declare
      # cmake_minimum_required() below 3.5, which CMake 4 refuses outright.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          cmake --version
          git --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Package runnable folder
        # Runs even if the tests fail, so a red run still hands back whatever
        # targets linked.
        if: always()
        shell: pwsh
        run: >
          ./scripts/package-build.ps1
          -Configuration ${{ matrix.configuration }}
          -BuildDir build/${{ matrix.preset }}
          -Output dist/rblx-${{ matrix.preset }}

      - name: Upload runnable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-${{ matrix.preset }}
          path: dist/rblx-${{ matrix.preset }}
          if-no-files-found: warn
