<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page" data-profile-page>
        <header class="topbar">
            <a class="brand" href="/" aria-label="RBLX Clone home">
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/dashboard" data-nav-user hidden>Home</a>
                <a href="/games">Games</a>
                <a href="/chat" data-nav-user hidden>Chat</a>
                <a href="/welcome">Tour</a>
                <a href="/create" data-nav-user hidden>Create</a>
                <a href="/dashboard#search" data-nav-user hidden>Search</a>
                <a href="/avatar" data-nav-user hidden>Avatar</a>
                <a href="/profile" data-nav-user hidden>Profile</a>
                <a href="/settings" data-nav-user hidden>Settings</a>
                <a href="/developers" data-nav-user hidden>Developers</a>
                <a href="/admin" data-admin-only data-nav-user hidden>Admin</a>
                <a href="/login" data-nav-guest>Login</a>
                <a href="/signup" data-nav-guest>Sign up</a>
                <button class="button danger" type="button" data-logout data-nav-user hidden>Logout</button>
            </nav>
        </header>

        <main id="main">
            <div class="dashboard-head">
                <div>
                    <p class="label" data-profile-label>Profile</p>
                    <h1 class="page-title" data-profile-title>Profile</h1>
                </div>
                <div data-profile-actions></div>
            </div>

            <div class="status" data-profile-status aria-live="polite"></div>

            <section class="profile-layout">
                <article class="panel profile-avatar-panel">
                    <h2>Avatar</h2>
                    <div class="avatar-stage profile-stage">
                        <div class="avatar-figure" data-profile-avatar role="img" aria-label="Profile avatar preview"></div>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-heading">
                        <div>
                            <p class="label">Stats</p>
                            <h2>Player info</h2>
                        </div>
                    </div>
                    <div class="stats-grid" data-profile-stats></div>
                </article>

                <article class="panel profile-friends-panel">
                    <div class="panel-heading">
                        <div>
                            <p class="label">Friends</p>
                            <h2>Friends</h2>
                        </div>
                    </div>
                    <div class="user-grid" data-profile-friends></div>
                </article>
            </section>
        </main>
        <footer class="legal-footer">
            <span>RBLX Clone · local prototype</span>
            <nav aria-label="Legal">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </nav>
        </footer>
    </div>
    <script src="/app.js?v=standing-2" defer></script>
</body>
</html>
