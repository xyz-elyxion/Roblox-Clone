name: Build

# One workflow, two stages: build the vendored build tool out of rblxbuild/, then
# use that tool - not an installed CMake on the runner - to configure, build, test and
# package the game. If the tool cannot build the project, that is the failure this
# workflow exists to report.
#
# The tool bootstrap only ever runs on a POSIX shell with a compiler: on Windows
# that means MSYS2/MinGW, because bootstrap rejects every generator except
# "MSYS Makefiles", "Unix Makefiles" and "Ninja". Once built, the tool itself can
# drive MSVC through the Visual Studio generator, so the game still ships a
# normal MSVC build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tree does not vendor OpenSSL (no TLS needed to build the tool) and its
  # Tests/ directory was pruned, so neither belongs in a bootstrap.
  RBLXBUILD_TOOL_FLAGS: -DRBLXBUILD_USE_OPENSSL=OFF -DBUILD_TESTING=OFF
  # GLFW and the other fetched dependencies declare minimum versions below 3.5,
  # which RBLXBuild - like the tool it was forked from - refuses outright.
  RBLXBUILD_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux:
    name: Linux Release (GCC)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/linux-release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('RBLXBuildLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache ccache
        # Without this every run recompiles ~19k lines of C++ from nothing.
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Build RBLXBuild
        # Out of source: bootstrap aborts if Bootstrap.cmk sits in the source
        # tree, so the tool's build directory stays separate from the checkout.
        run: |
          mkdir -p build/rblxbuild-tool
          cd build/rblxbuild-tool
          ../../rblxbuild/bootstrap \
            --parallel=$(nproc) \
            --generator=Ninja \
            -- $RBLXBUILD_TOOL_FLAGS
          ninja
          ./bin/rblxbuild --version

      - name: Configure the game with RBLXBuild
        run: >-
          ./build/rblxbuild-tool/bin/rblxbuild -S . -B build/linux-release
          -G Ninja
          -DRBLXBUILD_BUILD_TYPE=Release
          -DRBLXBUILD_C_COMPILER_LAUNCHER=ccache
          -DRBLXBUILD_CXX_COMPILER_LAUNCHER=ccache
          -DRBLX_BUILD_ANTICHEAT=OFF

      - name: Build the game with RBLXBuild
        run: ./build/rblxbuild-tool/bin/rblxbuild --build build/linux-release --parallel $(nproc)

      - name: Test
        # The tool built by bootstrap is the configure/build tool only: the
        # fork's test runner (rblxtest) is a target in its own build file, which
        # is not what bootstrap compiles, so build/rblxbuild-tool/bin has no
        # rblxtest in it. The tests are plain executables that return non-zero
        # on failure, so they run directly from the build directory - the same
        # working directory ctest used - and one failure does not hide the rest.
        run: |
          cd build/linux-release
          failed=0
          for t in *Tests; do
            echo "=== $t"
            "./$t" || failed=1
          done
          exit $failed

      - name: Upload binaries
        # Runs even when the tests fail, so a red run still has what linked.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-linux-release
          path: |
            build/linux-release/Studio
            build/linux-release/RBLXCode
            build/linux-release/Server
            build/linux-release/Client
            build/linux-release/WebApp
          if-no-files-found: warn

  macos:
    name: macOS Release (Clang)
    # Pinned to a named image rather than macos-latest, matching the retired
    # macos-14 image this job used to run on.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/macos-release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('RBLXBuildLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install build dependencies
        # clang and make ship with the command line tools; Ninja and ccache do not.
        run: |
          command -v ninja || brew install ninja
          command -v ccache || brew install ccache

      - name: Build RBLXBuild
        run: |
          mkdir -p build/rblxbuild-tool
          cd build/rblxbuild-tool
          ../../rblxbuild/bootstrap \
            --parallel=$(sysctl -n hw.ncpu) \
            --generator=Ninja \
            -- $RBLXBUILD_TOOL_FLAGS
          ninja
          ./bin/rblxbuild --version

      - name: Configure the game with RBLXBuild
        run: >-
          ./build/rblxbuild-tool/bin/rblxbuild -S . -B build/macos-release
          -G Ninja
          -DRBLXBUILD_BUILD_TYPE=Release
          -DRBLXBUILD_C_COMPILER_LAUNCHER=ccache
          -DRBLXBUILD_CXX_COMPILER_LAUNCHER=ccache
          -DRBLX_BUILD_ANTICHEAT=OFF

      - name: Build the game with RBLXBuild
        run: ./build/rblxbuild-tool/bin/rblxbuild --build build/macos-release --parallel $(sysctl -n hw.ncpu)

      - name: Test
        # See the Linux job: bootstrap produces the configure tool, not the test
        # runner, so the test executables are run directly.
        run: |
          cd build/macos-release
          failed=0
          for t in *Tests; do
            echo "=== $t"
            "./$t" || failed=1
          done
          exit $failed

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-macos-release
          path: |
            build/macos-release/Studio
            build/macos-release/RBLXCode
            build/macos-release/Server
            build/macos-release/Client
            build/macos-release/WebApp
          if-no-files-found: warn

  windows:
    name: Windows Release (MSVC, tool built with MinGW)
    runs-on: windows-2022
    timeout-minutes: 90

    # The bootstrap stage is a POSIX shell script, so it runs in MSYS2. The game
    # itself is configured and built by the tool it produces, with the Visual
    # Studio generator, so the shipped binaries are MSVC like before.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/windows-release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('RBLXBuildLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            make
            mingw-w64-x86_64-gcc

      - name: Build RBLXBuild
        # No --generator: bootstrap's MinGW default is "MSYS Makefiles", the
        # configuration whose POSIX paths MSYS make translates for native g++.
        run: |
          mkdir -p build/rblxbuild-tool
          cd build/rblxbuild-tool
          ../../rblxbuild/bootstrap \
            --parallel=$(nproc) \
            -- $RBLXBUILD_TOOL_FLAGS
          make -j$(nproc)
          ./bin/rblxbuild --version

      - name: Configure the game with RBLXBuild
        run: >-
          ./build/rblxbuild-tool/bin/rblxbuild -S . -B build/windows-release
          -G "Visual Studio 17 2022" -A x64
          -DRBLXBUILD_BUILD_TYPE=Release

      - name: Build the game with RBLXBuild
        run: >-
          ./build/rblxbuild-tool/bin/rblxbuild --build build/windows-release
          --config Release --parallel $(nproc)

      - name: Test
        # See the Linux job: there is no rblxtest binary to run here. The Visual
        # Studio generator drops the executables in Release\, and the working
        # directory stays the build directory ctest used.
        run: |
          cd build/windows-release
          failed=0
          for t in Release/*Tests.exe; do
            echo "=== $t"
            "./$t" || failed=1
          done
          exit $failed

      - name: Package runnable folder
        # Runs even if the tests fail, so a red run still hands back whatever
        # targets linked.
        if: always()
        shell: pwsh
        run: >
          ./scripts/package-build.ps1
          -Configuration Release
          -BuildDir build/windows-release
          -Output dist/rblx-windows-release

      - name: Upload runnable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-windows-release
          path: dist/rblx-windows-release
          if-no-files-found: warn
