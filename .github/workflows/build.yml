name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Release (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      # GLFW 3.3.8 and a few other FetchContent dependencies declare
      # cmake_minimum_required() below 3.5, which CMake 4 refuses outright.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        # GLFW, GLM, ImGui, ImGuizmo, rp3d and stb are cloned at configure time.
        # The key follows CMakeLists.txt, so a dependency bump refetches them.
        uses: actions/cache@v4
        with:
          path: build/windows-release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          cmake --version
          git --version

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release --output-on-failure

      - name: Package runnable folder
        # Runs even if the tests fail, so a red run still hands back whatever
        # targets linked.
        if: always()
        shell: pwsh
        run: >
          ./scripts/package-build.ps1
          -Configuration Release
          -BuildDir build/windows-release
          -Output dist/rblx-windows-release

      - name: Upload runnable package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-windows-release
          path: dist/rblx-windows-release
          if-no-files-found: warn

  linux:
    name: Linux Release (GCC)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/linux-release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache ccache
        # Without this every run recompiles ~19k lines of C++ from nothing.
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build/linux-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DRBLX_BUILD_ANTICHEAT=OFF

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Test
        run: ctest --test-dir build/linux-release --output-on-failure

      - name: Upload binaries
        # Same executables the macOS job hands back. Runs even when the tests
        # fail, so a red run still has the binaries that linked.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-linux-release
          path: |
            build/linux-release/Studio
            build/linux-release/RBLXCode
            build/linux-release/Server
            build/linux-release/Client
            build/linux-release/WebApp
          if-no-files-found: warn

  macos:
    name: macOS Release (Clang)
    # macos-14 was retired on 2026-11-02 and jobs on it were browned out before
    # that. macos-15 is a supported arm64 image; the job stays pinned to a named
    # image instead of macos-latest, which now follows macos-26.
    runs-on: macos-15
    timeout-minutes: 60

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/macos-release/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          cmake --version
          clang++ --version

      - name: Install build dependencies
        # GLFW, GLM, ImGui, ImGuizmo, rp3d and stb all come from FetchContent;
        # Ninja is the only tool the image does not always provide.
        run: |
          command -v ninja || brew install ninja
          command -v ccache || brew install ccache

      - name: Configure
        run: >
          cmake -S . -B build/macos-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DRBLX_BUILD_ANTICHEAT=OFF

      - name: Build
        run: cmake --build build/macos-release --parallel

      - name: Test
        run: ctest --test-dir build/macos-release --output-on-failure

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rblx-macos-release
          path: |
            build/macos-release/Studio
            build/macos-release/RBLXCode
            build/macos-release/Server
            build/macos-release/Client
            build/macos-release/WebApp
          if-no-files-found: warn
